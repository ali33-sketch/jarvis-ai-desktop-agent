<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus AI Agent - Command Center</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif;
        background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1329 100%);
        color: #e8f4ff;
        overflow: hidden;
      }

      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 20px rgba(94, 217, 255, 0.5), inset 0 0 20px rgba(94, 217, 255, 0.1); }
        50% { box-shadow: 0 0 40px rgba(94, 217, 255, 0.8), inset 0 0 40px rgba(94, 217, 255, 0.2); }
      }

      @keyframes float-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scan-line {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes neon-flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px #5ed9ff, 0 0 20px #5ed9ff; }
        20%, 24%, 55% { text-shadow: 0 0 5px #5ed9ff; }
      }

      @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }

      .app-shell {
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 280px) 1fr;
        grid-template-rows: auto 1fr;
        gap: 0;
      }

      .sidebar {
        grid-column: 1;
        grid-row: 1 / 3;
        background: rgba(8, 15, 35, 0.95);
        border-right: 2px solid rgba(94, 217, 255, 0.3);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        overflow-y: auto;
        box-shadow: inset -20px 0 40px rgba(94, 217, 255, 0.05);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(94, 217, 255, 0.1), rgba(77, 105, 255, 0.1));
        border: 1px solid rgba(94, 217, 255, 0.2);
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, #5ed9ff, #4d69ff);
        box-shadow: 0 0 25px rgba(94, 217, 255, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.3);
        position: relative;
        animation: glow-pulse 3s infinite;
      }

      .brand-mark::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid rgba(94, 217, 255, 0.4);
        animation: pulse-ring 2s infinite;
      }

      .brand h1 {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        background: linear-gradient(135deg, #5ed9ff, #a8d8ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: neon-flicker 3s infinite;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .nav-item {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 2px solid rgba(94, 217, 255, 0.2);
        color: #d0e0f0;
        border-radius: 12px;
        padding: 14px 12px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-weight: 500;
        position: relative;
        overflow: hidden;
      }

      .nav-item::before {
        content: '';
        position: absolute;
        left: -100%;
        top: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(94, 217, 255, 0.3), transparent);
        transition: left 0.5s;
      }

      .nav-item:hover {
        border-color: rgba(94, 217, 255, 0.5);
        background: rgba(94, 217, 255, 0.08);
        box-shadow: 0 0 15px rgba(94, 217, 255, 0.2);
      }

      .nav-item:hover::before {
        left: 100%;
      }

      .nav-item.active {
        background: linear-gradient(135deg, rgba(94, 217, 255, 0.2), rgba(77, 105, 255, 0.15));
        border-color: rgba(94, 217, 255, 0.6);
        box-shadow: 0 0 20px rgba(94, 217, 255, 0.4), inset 0 0 10px rgba(94, 217, 255, 0.1);
        color: #5ed9ff;
      }

      .status-panel {
        margin-top: auto;
        padding: 16px;
        border-radius: 16px;
        background: rgba(94, 217, 255, 0.05);
        border: 2px solid rgba(94, 217, 255, 0.3);
        box-shadow: 0 0 20px rgba(94, 217, 255, 0.1), inset 0 0 20px rgba(94, 217, 255, 0.05);
      }

      .status-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }

      .status-item:last-child {
        margin-bottom: 0;
      }

      .status-label {
        color: #a0c8e0;
      }

      .status-value {
        color: #5ed9ff;
        font-weight: 700;
        min-width: 80px;
        text-align: right;
      }

      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #70f0b2;
        box-shadow: 0 0 10px #70f0b2;
        margin-right: 6px;
      }

      .main-area {
        grid-column: 2;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        gap: 0;
        background: linear-gradient(135deg, rgba(10, 20, 45, 0.9), rgba(15, 35, 70, 0.85));
        overflow: hidden;
      }

      .topbar {
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(94, 217, 255, 0.2);
        background: rgba(8, 15, 35, 0.7);
        backdrop-filter: blur(10px);
      }

      .topbar-left h2 {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        margin: 0;
        background: linear-gradient(135deg, #5ed9ff, #a8d8ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: neon-flicker 4s infinite;
      }

      .topbar-left-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #5ed9ff;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .voice-btn {
        background: linear-gradient(135deg, rgba(94, 217, 255, 0.15), rgba(77, 105, 255, 0.1));
        border: 2px solid rgba(94, 217, 255, 0.4);
        color: #5ed9ff;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 0.9rem;
        box-shadow: 0 0 15px rgba(94, 217, 255, 0.2);
      }

      .voice-btn:hover {
        background: linear-gradient(135deg, rgba(94, 217, 255, 0.25), rgba(77, 105, 255, 0.2));
        border-color: rgba(94, 217, 255, 0.7);
        box-shadow: 0 0 25px rgba(94, 217, 255, 0.4);
        transform: translateY(-2px);
      }

      .banner {
        margin: 20px 28px;
        padding: 18px 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(94, 217, 255, 0.1), rgba(112, 240, 178, 0.05));
        border: 2px solid rgba(94, 217, 255, 0.3);
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 0 20px rgba(94, 217, 255, 0.15);
      }

      .signal {
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, #70f0b2, #1bd38c);
        border-radius: 50%;
        box-shadow: 0 0 20px #70f0b2, inset 0 0 10px rgba(255, 255, 255, 0.5);
        animation: glow-pulse 2s infinite;
      }

      .banner-text strong {
        display: block;
        color: #5ed9ff;
        margin-bottom: 4px;
      }

      .banner-text span {
        color: #a0c8e0;
        font-size: 0.9rem;
      }

      .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0 28px 28px;
        gap: 16px;
        min-height: 0;
      }

      .message-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 0;
      }

      .message-list::-webkit-scrollbar {
        width: 8px;
      }

      .message-list::-webkit-scrollbar-track {
        background: rgba(94, 217, 255, 0.05);
        border-radius: 10px;
      }

      .message-list::-webkit-scrollbar-thumb {
        background: rgba(94, 217, 255, 0.3);
        border-radius: 10px;
      }

      .message-list::-webkit-scrollbar-thumb:hover {
        background: rgba(94, 217, 255, 0.5);
      }

      .message {
        max-width: 70%;
        padding: 14px 16px;
        border-radius: 14px;
        line-height: 1.6;
        font-size: 0.96rem;
        animation: float-up 0.4s ease;
        backdrop-filter: blur(10px);
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(135deg, rgba(77, 105, 255, 0.25), rgba(94, 217, 255, 0.15));
        border: 2px solid rgba(94, 217, 255, 0.4);
        color: #e8f4ff;
        box-shadow: 0 0 15px rgba(94, 217, 255, 0.2);
      }

      .message.assistant {
        align-self: flex-start;
        background: rgba(94, 217, 255, 0.08);
        border: 2px solid rgba(94, 217, 255, 0.25);
        color: #d0e0f0;
        box-shadow: 0 0 10px rgba(94, 217, 255, 0.1);
      }

      .message.system {
        align-self: center;
        background: rgba(112, 240, 178, 0.1);
        border: 2px solid rgba(112, 240, 178, 0.3);
        color: #70f0b2;
        max-width: 90%;
        font-size: 0.9rem;
        box-shadow: 0 0 15px rgba(112, 240, 178, 0.2);
      }

      .typing-indicator {
        display: flex;
        gap: 6px;
        padding: 12px 16px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(94, 217, 255, 0.6);
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes typing {
        0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-10px); }
      }

      .input-area {
        display: flex;
        gap: 12px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(8, 15, 35, 0.9);
        border: 2px solid rgba(94, 217, 255, 0.3);
        box-shadow: 0 0 20px rgba(94, 217, 255, 0.15), inset 0 0 15px rgba(94, 217, 255, 0.05);
      }

      .input-area input {
        flex: 1;
        background: rgba(20, 40, 70, 0.6);
        border: 2px solid rgba(94, 217, 255, 0.2);
        border-radius: 12px;
        color: #e8f4ff;
        padding: 12px 16px;
        font-size: 0.96rem;
        transition: all 0.3s ease;
        outline: none;
      }

      .input-area input::placeholder {
        color: rgba(160, 200, 224, 0.5);
      }

      .input-area input:focus {
        border-color: rgba(94, 217, 255, 0.6);
        background: rgba(20, 40, 70, 0.8);
        box-shadow: 0 0 15px rgba(94, 217, 255, 0.3);
      }

      .input-area button {
        background: linear-gradient(135deg, #5ed9ff, #4d69ff);
        border: none;
        border-radius: 12px;
        color: white;
        padding: 12px 24px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        box-shadow: 0 0 20px rgba(94, 217, 255, 0.4);
      }

      .input-area button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(94, 217, 255, 0.6);
        background: linear-gradient(135deg, #7ae5ff, #6d7dff);
      }

      .input-area button:active {
        transform: translateY(0);
      }

      @media (max-width: 1024px) {
        .app-shell { grid-template-columns: 240px 1fr; }
        .message { max-width: 80%; }
      }

      @media (max-width: 768px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar {
          grid-column: 1;
          grid-row: 1;
          flex-direction: row;
          gap: 12px;
          padding: 12px;
          border-right: none;
          border-bottom: 2px solid rgba(94, 217, 255, 0.2);
          height: auto;
        }
        .brand { margin: 0; }
        .brand h1 { font-size: 1.1rem; }
        .nav {
          flex-direction: row;
          flex-wrap: wrap;
          flex: 1;
        }
        .nav-item { padding: 10px 12px; font-size: 0.85rem; }
        .status-panel {
          display: none;
        }
        .main-area {
          grid-row: 2;
          grid-column: 1;
        }
        .topbar {
          padding: 16px 20px;
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .topbar-left h2 { font-size: clamp(1.4rem, 3vw, 2rem); }
        .banner { margin: 16px 20px; padding: 14px 16px; }
        .chat-container { padding: 0 20px 20px; }
        .message { max-width: 85%; }
      }

      @media (max-width: 480px) {
        .sidebar { padding: 10px; gap: 8px; }
        .brand { gap: 8px; padding: 8px; }
        .brand-mark { width: 24px; height: 24px; }
        .brand h1 { font-size: 1rem; }
        .nav-item { padding: 8px 10px; font-size: 0.75rem; }
        .topbar-left h2 { font-size: 1.4rem; }
        .voice-btn { padding: 10px 16px; font-size: 0.8rem; }
        .banner { margin: 12px 16px; font-size: 0.85rem; }
        .chat-container { padding: 0 16px 16px; gap: 12px; }
        .message { max-width: 90%; font-size: 0.9rem; padding: 12px 14px; }
        .input-area { padding: 12px; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"></div>
          <h1>NEXUS</h1>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-nav="overview">Overview</button>
          <button class="nav-item" data-nav="agents">Agents</button>
          <button class="nav-item" data-nav="memory">Memory</button>
          <button class="nav-item" data-nav="system">System</button>
          <button class="nav-item" data-nav="settings">Settings</button>
        </nav>

        <div class="status-panel">
          <div class="status-item">
            <span class="status-label">System</span>
            <span class="status-value"><span class="status-indicator"></span>Online</span>
          </div>
          <div class="status-item">
            <span class="status-label">Status</span>
            <span class="status-value" id="statusValue">Ready</span>
          </div>
          <div class="status-item">
            <span class="status-label">Agent</span>
            <span class="status-value" id="agentValue">Idle</span>
          </div>
          <div class="status-item">
            <span class="status-label">CPU</span>
            <span class="status-value" id="cpuValue">34%</span>
          </div>
          <div class="status-item">
            <span class="status-label">Memory</span>
            <span class="status-value" id="memValue">5.8GB</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <div class="topbar-left-label">AI Command Center</div>
            <h2>Nexus AI Agent</h2>
          </div>
          <button class="voice-btn">🎙️ Voice</button>
        </header>

        <section class="banner">
          <div class="signal"></div>
          <div class="banner-text">
            <strong>System Online</strong>
            <span>Monitoring tasks, memory, system health, and automation workflows</span>
          </div>
        </section>

        <div class="chat-container">
          <div class="message-list" id="messageList">
            <div class="message system">Welcome to Nexus AI Agent. I'm your command center copilot. Ask me to open apps, manage files, or check system status.</div>
          </div>

          <form class="input-area" id="chatForm">
            <input 
              id="promptInput" 
              type="text"
              placeholder="Ask Nexus: open apps, check files, analyze processes, remember preferences..." 
              autocomplete="off"
            />
            <button type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>

    <script>
      const messageList = document.getElementById('messageList');
      const chatForm = document.getElementById('chatForm');
      const promptInput = document.getElementById('promptInput');
      const statusValue = document.getElementById('statusValue');
      const agentValue = document.getElementById('agentValue');
      const cpuValue = document.getElementById('cpuValue');
      const memValue = document.getElementById('memValue');

      const memory = {
        preferredEditor: 'VS Code',
        projectRoot: 'D:/Projects',
        workspaceSetup: ['Chrome', 'VS Code', 'Terminal']
      };

      let isProcessing = false;

      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messageList.appendChild(div);
        messageList.scrollTop = messageList.scrollHeight;
      }

      function showTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
        div.id = 'typing-indicator';
        messageList.appendChild(div);
        messageList.scrollTop = messageList.scrollHeight;
      }

      function removeTyping() {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
      }

      function updateStatus(status, agent) {
        statusValue.textContent = status;
        agentValue.textContent = agent;
      }

      function updateSystemMetrics() {
        const cpu = Math.floor(Math.random() * 60) + 15;
        const mem = (Math.random() * 8 + 4).toFixed(1);
        cpuValue.textContent = cpu + '%';
        memValue.textContent = mem + 'GB';
      }

      async function simulateToolExecution(tool, payload, duration = 800) {
        updateStatus('Executing', tool);
        await new Promise(resolve => setTimeout(resolve, duration));
      }

      function classifyIntent(input) {
        const lower = input.toLowerCase();

        if ((lower.includes('open') || lower.includes('launch')) && lower.includes('vscode')) {
          return { tool: 'open_app', appName: 'VS Code', icon: '💻' };
        }
        if (lower.includes('chrome') || (lower.includes('open') && lower.includes('browser'))) {
          return { tool: 'open_app', appName: 'Chrome', icon: '🌐' };
        }
        if (lower.includes('file') || lower.includes('folder') || lower.includes('show my files') || lower.includes('list')) {
          return { tool: 'list_files', path: memory.projectRoot, icon: '📁' };
        }
        if (lower.includes('ram') || lower.includes('cpu') || lower.includes('process') || lower.includes('memory') || lower.includes('system')) {
          return { tool: 'system_status', icon: '⚙️' };
        }
        if (lower.includes('start') && lower.includes('setup')) {
          return { tool: 'workspace_setup', icon: '🚀' };
        }
        if (lower.includes('remember') || lower.includes('note')) {
          return { tool: 'remember', key: 'note_' + Date.now(), value: input, icon: '💾' };
        }
        if (lower.includes('help') || lower.includes('what can')) {
          return { tool: 'help', icon: '❓' };
        }

        return { tool: 'chat_reply', icon: '💬' };
      }

      async function executeTool(tool, payload) {
        switch (tool) {
          case 'open_app':
            await simulateToolExecution('open_app', payload, 1200);
            return `✓ ${payload.icon} Launching ${payload.appName}...`;

          case 'list_files':
            await simulateToolExecution('list_files', payload, 800);
            const files = ['project.json', 'notes.md', 'summary.txt', 'config.yaml', 'data.csv'];
            return `✓ ${payload.icon} Found ${files.length} files in ${payload.path}:\n• ${files.join('\n• ')}`;

          case 'system_status':
            updateSystemMetrics();
            await simulateToolExecution('system_status', payload, 1000);
            return `✓ ${payload.icon} System Status:\n• CPU: ${cpuValue.textContent}\n• Memory: ${memValue.textContent} used\n• Disk: 70% used\n• Network: Online\n• Processes: 127 active`;

          case 'workspace_setup':
            await simulateToolExecution('workspace_setup', payload, 2000);
            return `✓ ${payload.icon} Workspace Setup:\n${memory.workspaceSetup.map((app, i) => `${i + 1}. ${app}`).join('\n')}`;

          case 'remember':
            await simulateToolExecution('remember', payload, 600);
            return `✓ ${payload.icon} Saved to memory: "${payload.value.substring(0, 50)}..."`;

          case 'help':
            return `${payload.icon} I can help with:\n• "Open [app]" → Launch applications\n• "Show my files" → List project files\n• "System status" → Check resources\n• "Start my setup" → Initialize workspace\n• "Remember [note]" → Save notes\n\nWhat would you like to do?`;

          case 'chat_reply':
            await simulateToolExecution('chat_reply', payload, 600);
            return `I can open apps, inspect files, check system status, and manage your workflow. Try: "Open VS Code" or "Show my files"`;

          default:
            return 'Command processed.';
        }
      }

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (isProcessing) return;

        const text = promptInput.value.trim();
        if (!text) return;

        isProcessing = true;
        promptInput.disabled = true;

        addMessage('user', text);
        promptInput.value = '';

        updateStatus('Thinking...', 'Planning');
        showTyping();

        try {
          const intent = classifyIntent(text);
          await new Promise(resolve => setTimeout(resolve, 400));

          removeTyping();
          const response = await executeTool(intent.tool, intent);

          updateStatus('Complete', 'Idle');
          addMessage('assistant', response);

          // Simulate occasional system messages
          if (Math.random() < 0.3) {
            await new Promise(resolve => setTimeout(resolve, 1500));
            const sysMessages = [
              'Memory usage optimized',
              'Cache cleared successfully',
              'Background processes updated'
            ];
            addMessage('system', sysMessages[Math.floor(Math.random() * sysMessages.length)]);
          }
        } catch (error) {
          removeTyping();
          updateStatus('Error', 'Failed');
          addMessage('assistant', `⚠️ Error: ${error.message}`);
        } finally {
          isProcessing = false;
          promptInput.disabled = false;
          promptInput.focus();
        }
      });

      // Nav click handlers
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
        });
      });

      // Initial focus
      promptInput.focus();

      // Update metrics periodically
      setInterval(updateSystemMetrics, 3000);
    </script>
  </body>
</html>
