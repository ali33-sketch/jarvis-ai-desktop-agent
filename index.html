<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus AI Agent</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: rgba(12, 21, 35, 0.92);
        --panel-2: rgba(16, 27, 41, 0.9);
        --line: rgba(255,255,255,0.08);
        --text: #edf7ff;
        --muted: #a5bdd8;
        --cyan: #5ed9ff;
        --blue: #518dff;
        --green: #70f0b2;
        --glow: rgba(70, 203, 255, 0.35);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, rgba(48,120,255,0.22), transparent 30%), linear-gradient(180deg, #07111f 0%, #0b1320 100%);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-height: 100vh;
      }

      .app-shell {
        width: min(1400px, 100%);
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
      }

      .sidebar {
        background: rgba(9, 17, 27, 0.96);
        border-right: 1px solid var(--line);
        padding: 24px 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 6px 12px;
      }

      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(180deg, var(--cyan), var(--blue));
        box-shadow: 0 0 18px var(--glow);
      }

      h1 {
        margin: 0;
        font-size: 1.3rem;
        letter-spacing: 0.08em;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .nav-item {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.06);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .nav-item.active, .nav-item:hover {
        background: linear-gradient(135deg, rgba(29, 113, 255, 0.18), rgba(99, 224, 255, 0.05));
        border-color: rgba(98, 197, 255, 0.35);
      }

      .status-box {
        margin-top: auto;
        padding: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .status-row:last-child { margin-bottom: 0; }

      .status-row strong {
        color: var(--text);
      }

      .main {
        display: flex;
        flex-direction: column;
        padding: 24px 28px 30px;
        gap: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .eyebrow {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--cyan);
      }

      .topbar h2 {
        margin: 6px 0 0;
        font-size: clamp(1.7rem, 2vw, 2.6rem);
      }

      .voice-btn {
        background: rgba(82, 154, 255, 0.12);
        border: 1px solid rgba(112, 208, 255, 0.45);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
      }

      .banner {
        display: flex;
        align-items: center;
        gap: 14px;
        background: rgba(12, 29, 46, 0.9);
        border: 1px solid rgba(101, 189, 255, 0.22);
        border-radius: 18px;
        padding: 18px 20px;
      }

      .signal {
        width: 14px;
        height: 14px;
        background: linear-gradient(180deg, var(--green), #1bd38c);
        border-radius: 50%;
        box-shadow: 0 0 18px rgba(54, 234, 160, 0.9);
      }

      .banner strong, .banner span {
        display: block;
      }

      .banner span {
        color: var(--muted);
        margin-top: 4px;
      }

      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
      }

      .message-list {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 320px;
      }

      .message {
        max-width: 74%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.55;
        font-size: 0.96rem;
      }

      .message.user {
        align-self: flex-end;
        background: rgba(61, 109, 255, 0.22);
        border: 1px solid rgba(113, 151, 255, 0.38);
      }

      .message.assistant {
        align-self: flex-start;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .composer {
        display: flex;
        gap: 12px;
        margin-top: auto;
      }

      .composer input {
        flex: 1;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        padding: 14px 16px;
        outline: none;
      }

      .composer button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #4d69ff, #5ddaff);
        color: white;
        padding: 0 18px;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
        .message { max-width: 90%; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>NEXUS</h1>
        </div>

        <nav class="nav">
          <button class="nav-item active">Overview</button>
          <button class="nav-item">Agents</button>
          <button class="nav-item">Memory</button>
          <button class="nav-item">System</button>
          <button class="nav-item">Settings</button>
        </nav>

        <div class="status-box">
          <div class="status-row"><span>Status</span><strong id="statusText">Ready</strong></div>
          <div class="status-row"><span>Agent</span><strong id="agentText">Idle</strong></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div class="eyebrow">AI Command Center</div>
            <h2>Nexus AI Agent</h2>
          </div>
          <button class="voice-btn">Voice</button>
        </header>

        <section class="banner">
          <div class="signal"></div>
          <div>
            <strong>System Online</strong>
            <span>Monitoring tasks, memory, system health, and local automation</span>
          </div>
        </section>

        <section class="chat-panel">
          <div class="message-list" id="messageList">
            <div class="message assistant">Welcome back. I’m Nexus AI Agent. Ask me to open apps, inspect files, and manage workflows.</div>
          </div>

          <form class="composer" id="chatForm">
            <input id="promptInput" placeholder="Ask Nexus to open an app, inspect files, or check system status..." autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      const statusText = document.getElementById('statusText');
      const agentText = document.getElementById('agentText');
      const messageList = document.getElementById('messageList');
      const chatForm = document.getElementById('chatForm');
      const promptInput = document.getElementById('promptInput');

      const memory = {
        preferredEditor: 'VS Code',
        projectRoot: 'D:/Projects'
      };

      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messageList.appendChild(div);
        messageList.scrollTop = messageList.scrollHeight;
      }

      function setAgentState(status, agent) {
        statusText.textContent = status;
        agentText.textContent = agent;
      }

      function classifyIntent(input) {
        const lower = input.toLowerCase();

        if (lower.includes('open') && lower.includes('vscode')) {
          return { tool: 'open_app', appName: 'VS Code' };
        }

        if (lower.includes('chrome') || lower.includes('browser')) {
          return { tool: 'open_app', appName: 'Chrome' };
        }

        if (lower.includes('file') || lower.includes('folder') || lower.includes('show my files')) {
          return { tool: 'list_files', path: memory.projectRoot };
        }

        if (lower.includes('ram') || lower.includes('cpu') || lower.includes('process') || lower.includes('system')) {
          return { tool: 'system_status', command: 'Get-Process | Sort-Object CPU -Descending | Select-Object -First 5 Name, CPU, Id' };
        }

        if (lower.includes('remember') || lower.includes('memory')) {
          return { tool: 'remember', key: 'favorite_task', value: input };
        }

        return { tool: 'chat_reply', message: 'I can open apps, inspect files, check system status, and remember your preferences. Try: "Open VS Code" or "Show my files".' };
      }

      function executeTool(tool, payload) {
        if (tool === 'open_app') {
          return `Opened ${payload.appName} successfully.`;
        }

        if (tool === 'list_files') {
          return `Files in ${payload.path}: notes.md, project.json, summary.txt`;
        }

        if (tool === 'system_status') {
          return 'System overview: CPU 34%, Memory 5.8 GB / 16 GB, Disk 70% used.';
        }

        if (tool === 'remember') {
          return `Saved memory: ${payload.key} = ${payload.value}`;
        }

        if (tool === 'chat_reply') {
          return payload.message;
        }

        return 'Command processed.';
      }

      chatForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const text = promptInput.value.trim();
        if (!text) return;

        addMessage('user', text);
        promptInput.value = '';

        setAgentState('Thinking...', 'Planning');

        setTimeout(() => {
          const intent = classifyIntent(text);
          const response = executeTool(intent.tool, intent);

          setAgentState('Complete', 'Idle');
          addMessage('assistant', response);
        }, 500);
      });
    </script>
  </body>
</html>
